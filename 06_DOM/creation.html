<!DOCTYPE html>
<html lang="en">
<head>
    <title>DOM Creation</title>
</head>
<body style="background-color: #212121;">

    
</body>

<script>
const div = document.createElement('div')
console.log(div);
div.className = "Main"
div.id = Math.round(Math.random() * 10);
div.setAttribute("title","generated title")
div.style.backgroundColor = "green";
div.style.padding = "12px";
// div.innerText = "It create a round first take the text then update it long prosses"
const addText = document.createTextNode("Chai aur code") //It only exists in JavaScript memory.
div.appendChild(addText)//text node becomes the child of the div.
// div
// └── "Chai aur code"

// Nothing appears on the webpage because the div itself is not inside the document.

// It is still only in memory.

document.body.appendChild(div) 
// Now JavaScript takes the whole div and places it inside the <body>
</script>
</html>
