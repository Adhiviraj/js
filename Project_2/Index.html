<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>BMI Calculator</h1>

        <form id="bmi-form">

        <label for="height">Enter your height (meters):</label>
        <input type="number" id="height" name="height" min="0.5" max="2.5" step="0.01" placeholder="e.g. 1.75">

        <br><br>

        <label for="weight">Enter your weight (kg):</label>
        <input type="number" id="weight" name="weight" min="1" max="250" step="0.1" placeholder="e.g. 70">

        <br><br>

        <button type="submit">Calculate BMI</button>

        </form>

        <h3>Your BMI: <span id="result"></span></h3>

    </div>

</body>

<script src="script.js"></script>

</html>
